<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@500;600&family=Noto+Sans+SC:wght@700&display=swap">
<style>
  body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #eef1ee; color: #15191a; font-family: "IBM Plex Sans", "Noto Sans SC", sans-serif; position: relative; }
  body::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(91,102,98,.35) 1.2px, transparent 1.8px); background-size: 24px 24px; }
  body::after { content: ""; position: absolute; right: -120px; top: -160px; width: 760px; height: 760px; background: radial-gradient(closest-side, rgba(215,240,90,.55), transparent 70%); }
  .wrap { position: relative; z-index: 1; padding: 72px 80px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; }
  .eyebrow { font: 500 22px/1.4 "IBM Plex Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: #5b6662; }
  h1 { font: 800 92px/1 "Bricolage Grotesque", "Noto Sans SC", sans-serif; letter-spacing: -0.035em; margin: 22px 0 14px; }
  .sub { font: 600 36px/1.3 "IBM Plex Sans", sans-serif; max-width: 920px; margin: 0; }
  mark { background: #e7f4a8; box-shadow: inset 0 -4px 0 #8fae12; color: inherit; padding: 0 .1em; border-radius: 4px; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; font: 500 24px/1.4 "IBM Plex Mono", monospace; color: #5b6662; }
  .shot { position: absolute; z-index: 1; right: -40px; bottom: -40px; width: 620px; border-radius: 16px; border: 1px solid #cfd6d1; box-shadow: 0 30px 60px -30px rgba(21,25,26,.45); }
  body.project h1 { font-size: 80px; max-width: 560px; }
  body.project .sub { max-width: 520px; font-size: 32px; }
</style></head>
<body><div class="wrap" id="c"></div></body></html>
